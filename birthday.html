<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday 🎂🏐</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="second-page">

    <!-- Balloons -->
    <div class="balloon b1">🎈</div>
    <div class="balloon b2">🎈</div>
    <div class="balloon b3">🎈</div>
    <div class="balloon b4">🎈</div>
    <div class="balloon b5">🎈</div>

    <!-- Volleyball -->
    <div class="second-ball">🏐</div>

    <!-- Main content -->
    <div class="birthday-card">

        <div class="photo-box">
            <img
                src="birthday-person.jpg"
                alt="Birthday Person"
            >
        </div>

        <h1>Happy Birthday! 🎂🎉</h1>

        <h2>Someone Special 💖</h2>

        <p>
            Wishing you lots of happiness,
            smiles and beautiful memories! ✨
        </p>

        <div class="birthday-dog">
            🐶
        </div>

        <p class="surprise-text">
            Your special surprise is waiting... 👀
        </p>

        <button class="surprise-btn" onclick="alert('🎉 Surprise! Happy Birthday! 💖')">
            Tap Here 💝
        </button>

    </div>

</body>
</html>
