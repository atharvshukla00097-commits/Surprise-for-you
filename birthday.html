<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Happy Birthday 🎂</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="birthday-page">

    <!-- Background balloons -->
    <div class="page2-balloon p2b1">🎈</div>
    <div class="page2-balloon p2b2">🎈</div>
    <div class="page2-balloon p2b3">🎈</div>
    <div class="page2-balloon p2b4">🎈</div>
    <div class="page2-balloon p2b5">🎈</div>

    <!-- Volleyball -->
    <div class="page2-ball">🏐</div>

    <main class="birthday-card">

        <!-- Small photo -->
        <div class="small-photo">
            <img
                src="birthday-person.jpg"
                alt="Birthday Person"
            >
        </div>

        <p class="hello-text">
            Hey <span id="birthdayName">Friend</span> 💖
        </p>

        <h1>
            Happy Birthday! 🎂
        </h1>

        <p class="wish-text">
            May your special day be filled with
            happiness, laughter and beautiful memories! ✨
        </p>

        <div class="page2-dog">
            🐶
        </div>

        <p class="tap-text">
            Abhi ek aur surprise baaki hai 👀
        </p>

        <button
            type="button"
            onclick="goToMomo()"
        >
            Tap Here 💝
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
