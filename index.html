<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Surprise 🏐🐶</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="home">

    <!-- =========================
         FIRST PAGE
    ========================== -->

    <!-- Volleyball decorations -->
    <div class="volleyball ball1">🏐</div>
    <div class="volleyball ball2">🏐</div>
    <div class="volleyball ball3">🏐</div>

    <!-- Pomeranian decorations -->
    <div class="dog dog1">🐶</div>
    <div class="dog dog2">🐕</div>

    <main class="home-card">

        <div class="top-icon">🏐</div>

        <h1>Birthday Surprise 🎂</h1>

        <p class="intro">
            A special birthday surprise is waiting for you! 💖
        </p>

        <div class="cute-dog">
            🐶
        </div>

        <p class="enter-text">
            Birthday person ka naam likho 💕
        </p>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter name..."
            maxlength="30"
            autocomplete="off"
        >

        <button onclick="startBirthday()">
            Celebrate 🎉
        </button>

    </main>


    <!-- =========================
         SECOND PAGE
    ========================== -->

    <section id="birthdayPage" class="birthday-page">

        <!-- Volleyball -->
        <div class="volleyball big-ball">
            🏐
        </div>

        <!-- Balloons -->
        <div class="balloon balloon1">🎈</div>
        <div class="balloon balloon2">🎈</div>
        <div class="balloon balloon3">🎈</div>
        <div class="balloon balloon4">🎈</div>
        <div class="balloon balloon5">🎈</div>

        <!-- Birthday person's photo -->
        <div class="birthday-photo">
            <img
                id="birthdayPhoto"
                src="birthday-person.jpg"
                alt="Birthday Person"
            >
        </div>

        <h1>
            Happy Birthday! 🎂🎉
        </h1>

        <!-- Name automatically appears here -->
        <h2 id="personName"></h2>

        <p class="birthday-message">
            Wishing you a day full of happiness,
            smiles and beautiful memories! 💖
        </p>

        <!-- Pomeranian -->
        <div class="birthday-dog">
            🐶
        </div>

        <p class="tap-message">
            Ek aur surprise tumhara wait kar raha hai 👀
        </p>

        <button onclick="showNextSurprise()">
            Tap Here 💝
        </button>

    </section>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
