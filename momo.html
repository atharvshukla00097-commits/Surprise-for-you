<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Momo Surprise 🐶❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="momo-page">

    <!-- Cute floating decorations -->
    <div class="momo-float momo1">❤️</div>
    <div class="momo-float momo2">🐾</div>
    <div class="momo-float momo3">❤️</div>
    <div class="momo-float momo4">🐾</div>

    <main class="momo-card">

        <div class="momo-dog">
            🐶
        </div>

        <div class="momo-hearts">
            ❤️ 🐾 ❤️
        </div>

        <p class="final-small">
            Hey <span id="momoName">Friend</span>...
        </p>

        <h1>
            Momo Time! 🐶❤️
        </h1>

        <p class="momo-message">
            Birthday surprise ka sabse cute part
            abhi baaki tha! 🥹
        </p>

        <div class="momo-box">
            🐶
        </div>

        <h2>
            Stay Happy & Keep Smiling! 💖
        </h2>

        <p class="final-message">
            This little surprise was made
            specially for you. 🎂✨
        </p>

        <button
            type="button"
            onclick="finalSurprise()"
        >
            One Last Surprise 🎁
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
