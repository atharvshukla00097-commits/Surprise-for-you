<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Surprise 🏐🐶</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="home">

    <!-- Volleyball decorations -->
    <div class="volleyball ball1">🏐</div>
    <div class="volleyball ball2">🏐</div>
    <div class="volleyball ball3">🏐</div>

    <!-- Pomeranian -->
    <div class="dog dog1">🐶</div>
    <div class="dog dog2">🐕</div>

    <main class="home-card">

        <div class="top-icon">🏐</div>

        <h1>Birthday Surprise</h1>

        <p class="intro">
            A special birthday surprise is waiting for you! 🎂
        </p>

        <div class="cute-dog">
            🐶
        </div>

        <p class="enter-text">
            Birthday person ka naam likho 💖
        </p>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter name..."
            maxlength="30"
            autocomplete="off"
        >

        <button type="button" onclick="startBirthday()">
            Celebrate 🎉
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
